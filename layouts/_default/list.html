{{ define "main" }}
<section class="container page-section">
  <h1>{{ .Title }}</h1>

  {{ range .Pages }}
  <article class="post-card">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .Description }}
    <p>{{ . }}</p>
    {{ end }}
    <p class="post-card__date">{{ .Date.Format "January 2, 2006" }}</p>
  </article>
  {{ else }}
  <p>No blog posts found yet.</p>
  {{ end }}
</section>
{{ end }}
