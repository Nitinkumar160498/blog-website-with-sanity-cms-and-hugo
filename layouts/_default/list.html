{{ define "main" }}
<section class="container page-section">
  <h1>{{ .Title }}</h1>

  {{ range .Pages }}
  <article class="post-card">
    <h2>
      <a href="{{ .RelPermalink }}">
        {{ .Title }}
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round"></path>
        </svg>
      </a>
    </h2>
    {{ with .Description }}
    <p>{{ . }}</p>
    {{ end }}
    <p class="post-card__date">{{ .Date.Format "January 2, 2006" }}</p>
  </article>
  {{ else }}
  <p>No blog posts found yet.</p>
  {{ end }}
</section>
{{ end }}
