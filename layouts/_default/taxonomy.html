{{ define "main" }}
<section class="container page-section">
  <h1>{{ .Title }}</h1>

  {{ with .Pages }}
  {{ range . }}
  <article class="post-card">
    <h2>
      <a href="{{ .RelPermalink }}">
        {{ .LinkTitle }}
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round"></path>
        </svg>
      </a>
    </h2>
    {{ with .Description }}
    <p>{{ . }}</p>
    {{ end }}
  </article>
  {{ end }}
  {{ else }}
  <p>No blog posts found in this section yet.</p>
  {{ end }}
</section>
{{ end }}
